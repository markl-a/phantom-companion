[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-companion"
version = "0.1.0a0"
description = "Proactive behavior observer + LLM insight for phantom-mesh."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Mark Lai" }]

[project.scripts]
phantom-companion = "phantom_companion.cli:main"

[tool.setuptools.packages.find]
include = ["phantom_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
