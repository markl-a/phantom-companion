[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-companion"
version = "0.1.0a0"
description = "Proactive behavior observer + LLM insight for phantom-mesh."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Mark Lai" }]
keywords = ["behavior", "local-first", "wellness", "reports", "phantom-mesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Processing :: General",
]

dependencies = ["mcp>=1"]

[project.urls]
Homepage = "https://github.com/markl-a/phantom-companion"
Repository = "https://github.com/markl-a/phantom-companion"
Issues = "https://github.com/markl-a/phantom-companion/issues"
Changelog = "https://github.com/markl-a/phantom-companion/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
phantom-companion = "phantom_companion.cli:main"

[tool.setuptools.packages.find]
include = ["phantom_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
