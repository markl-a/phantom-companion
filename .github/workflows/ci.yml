name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pip wheel . --no-deps -w dist-smoke
      - run: python -m ruff check .
      - run: python -m pytest tests/ -ra -q
      - name: deterministic demo-loop smoke
        run: python -m phantom_companion.cli demo-loop --out demo-loop-smoke --end 2026-05-30 --days 30 --seed 42
      - name: release-prep gate
        run: python -m pytest tests/test_release_prep_contract.py -q
